  <script>
    // o F1 A2 inteiro, a Ellen e o Fabio escondidos atrás do carrinho de sorvete e os dois do passado
    // no banco (o mesmo enquadramento do HOME do v2/tools/headless.js)
    window.addEventListener('load', () => {
      __open(['F1A1', 'F1A2'], 1);
      Debug.flags.invisible = true;
      const st = StealthState.inspect(), ox = 384;
      __tp(ox + 112, 158); st.ellen.dir = 'right'; st.fabio.dir = 'right';
      __at(3.5); __run(0.6);
      st.fabio.dir = 'right';
      Camera.follow(ox + 192, st.room.w); Dialog.close(); Game.__orig.render(Gfx.ctx);
    });
